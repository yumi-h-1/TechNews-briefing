[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technews-briefing"
version = "0.1.0"
description = "Auditable collection for a personal UK, US and Korean tech briefing"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1,<2", "langchain-openai>=1,<2", "langsmith>=0.4,<1",
  "beautifulsoup4>=4.13,<5", "httpx>=0.28,<1", "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["briefing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
