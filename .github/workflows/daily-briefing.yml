name: Daily briefing

# Free alternative to the always-on Render worker: GitHub starts a short job each morning.
# Cron is UTC and GitHub often starts scheduled jobs hours late, so several triggers
# spread over the day. `briefing once` waits when started up to two hours before 07:00
# London; otherwise the first run of the London day prepares and sends that day's
# edition (never before 08:00), however late it starts. Later runs that day do nothing.
on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 GMT / 06:17 BST — waits for 07:00 London
    - cron: "17 6 * * *"   # 06:17 GMT / 07:17 BST
    - cron: "17 7 * * *"   # 07:17 GMT / 08:17 BST
    - cron: "47 7 * * *"   # 07:47 GMT / 08:47 BST
    - cron: "17 11 * * *"  # midday backup
    - cron: "17 15 * * *"  # afternoon backup
  workflow_dispatch:
    inputs:
      command:
        description: "doctor = check secrets only; once = send today's edition now if not yet sent (from 07:00 London)"
        type: choice
        options: [doctor, once]
        default: doctor

concurrency:
  group: daily-briefing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DATA_DIR: var
      PREPARATION_MINUTES: "60"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'false' }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT || 'technews-briefing' }}
      COMMAND: ${{ inputs.command || 'once' }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev

      # The SQLite database keeps send state and story history between runs.
      - name: Restore briefing database
        uses: actions/cache/restore@v5
        with:
          path: var/briefing.sqlite3
          key: briefing-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: briefing-db-

      - name: Run briefing
        run: uv run --locked --no-dev python -m briefing "$COMMAND"

      - name: Save briefing database
        if: always() && hashFiles('var/briefing.sqlite3') != ''
        uses: actions/cache/save@v5
        with:
          path: var/briefing.sqlite3
          key: briefing-db-${{ github.run_id }}-${{ github.run_attempt }}
